<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcade | Looters Computas</title>
<meta name="description" content="Thousands of free browser games from Looters Computas. No sign-up, just play.">
<style>
:root{--bg:#f2f2f0;--ink:#1d1a24;--mute:#6b6676;--card:#fff;--line:#dcdad6;--orange:#f26a1b;--purple:#5b3fa8}
@media (prefers-color-scheme:dark){:root{--bg:#17141d;--ink:#f2f0f6;--mute:#a49fb0;--card:#221e2b;--line:#34303f;--orange:#ff8a45;--purple:#a58cf0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS",Verdana,sans-serif}
header,main{max-width:1100px;margin:0 auto;padding:16px 20px}
header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
header a{color:var(--purple);font-weight:700;text-decoration:none}
header a:hover{text-decoration:underline}
h1{font:800 clamp(2rem,6vw,3.4rem)/1.05 "Arial Black",Impact,sans-serif;margin:8px 0 6px;color:var(--orange);letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 16px;max-width:52ch}
#q{width:100%;max-width:420px;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:14px}
#chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
#chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:999px;font:inherit;cursor:pointer;text-transform:capitalize}
#chips button[aria-pressed=true]{background:var(--purple);border-color:var(--purple);color:#fff}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.g{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;text-align:left;padding:0;color:inherit;font:inherit}
.g img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--line)}
.g span{display:block;padding:8px 10px;font-weight:700;font-size:.85rem;line-height:1.3}
.g:hover,.g:focus-visible{outline:3px solid var(--orange)}
#more{display:none;margin:24px auto 0;background:var(--orange);color:#111;border:0;border-radius:8px;padding:10px 24px;font:700 1rem "Trebuchet MS",sans-serif;cursor:pointer}
#msg{color:var(--mute)}
#player{position:fixed;inset:0;background:rgba(10,8,14,.9);display:none;flex-direction:column;z-index:10}
#player.open{display:flex}
#bar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:#111;color:#eee}
#bar button{background:var(--orange);color:#111;border:0;padding:6px 14px;border-radius:6px;font-weight:700;cursor:pointer}
#frame{flex:1;width:100%;border:0;background:#000}
</style>
</head>
<body>
<header>
  <div>
    <a href="/">← Looters</a>
    <h1>Arcade</h1>
    <p class="sub">Thousands of free browser games. Search or pick a category, then play instantly.</p>
  </div>
</header>
<main>
  <input id="q" type="search" placeholder="Search games…" autocomplete="off">
  <div id="chips"></div>
  <div id="grid"><p id="msg">Loading…</p></div>
  <button id="more">Load more</button>
</main>
<div id="player">
  <div id="bar"><button id="close">← Back</button><span id="ptitle"></span></div>
  <iframe id="frame" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
</div>
<script>
(function(){
  var PAGE=48,clid="",games=[],list=[],shown=0,cat="all",term="";
  function $(id){return document.getElementById(id)}
  var grid=$("grid"),chips=$("chips"),msg=$("msg"),more=$("more"),player=$("player"),frame=$("frame");

  function card(g){
    var b=document.createElement("button");b.type="button";b.className="g";
    var i=document.createElement("img");
    i.src="https://static.playgama.com/p-img/pg/"+g[0]+"/icon/"+g[2]+"?width=448";i.alt="";i.loading="lazy";
    var s=document.createElement("span");s.textContent=g[1];
    b.appendChild(i);b.appendChild(s);
    b.addEventListener("click",function(){play(g)});
    return b;
  }
  function filter(){
    var t=term.toLowerCase();
    list=games.filter(function(g){return (cat==="all"||g[3]===cat)&&(!t||g[1].toLowerCase().indexOf(t)>-1)});
    grid.textContent="";shown=0;next();
  }
  function next(){
    list.slice(shown,shown+PAGE).forEach(function(g){grid.appendChild(card(g))});
    shown+=PAGE;
    more.style.display=shown<list.length?"block":"none";
    msg.textContent=list.length?"":"No games found. Try a different search.";
  }
  function makeChips(){
    var order=["all","arcade","puzzle","action","racing","shooting","strategy","simulation","adventure","idle","sports","kids","other"];
    order.forEach(function(c){
      var b=document.createElement("button");b.type="button";b.textContent=c;
      b.setAttribute("aria-pressed",c===cat);
      b.addEventListener("click",function(){
        cat=c;
        Array.prototype.forEach.call(chips.children,function(x){x.setAttribute("aria-pressed",x.textContent===c)});
        filter();
      });
      chips.appendChild(b);
    });
  }
  function play(g){
    $("ptitle").textContent=g[1];
    frame.src="https://playgama.com/export/game/"+encodeURIComponent(g[0])+"?clid="+encodeURIComponent(clid);
    player.classList.add("open");document.body.style.overflow="hidden";
  }
  function close(){player.classList.remove("open");frame.src="about:blank";document.body.style.overflow=""}
  $("close").addEventListener("click",close);
  more.addEventListener("click",next);
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&player.classList.contains("open"))close()});
  var timer;
  $("q").addEventListener("input",function(e){clearTimeout(timer);var v=e.target.value;timer=setTimeout(function(){term=v;filter()},200)});

  fetch("/arcade-games.json").then(function(r){return r.json()}).then(function(d){
    clid=d.clid;games=d.games;makeChips();filter();
  }).catch(function(){msg.textContent="The arcade could not load right now. Please try again in a few minutes."});
})();
</script>
</body>
</html>
