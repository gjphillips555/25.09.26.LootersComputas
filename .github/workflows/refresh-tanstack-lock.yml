name: Refresh patched TanStack lockfile

on:
  push:
    branches:
      - feature/siftah-credits-live
    paths:
      - package.json

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify patched TanStack versions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const versions = {
            reactStart: lock.packages['node_modules/@tanstack/react-start']?.version,
            serverCore: lock.packages['node_modules/@tanstack/start-server-core']?.version,
          };
          const cmp = (a, b) => {
            const aa = a.split('.').map(Number);
            const bb = b.split('.').map(Number);
            for (let i = 0; i < 3; i++) if ((aa[i] || 0) !== (bb[i] || 0)) return (aa[i] || 0) - (bb[i] || 0);
            return 0;
          };
          if (!versions.reactStart || cmp(versions.reactStart, '1.168.60') < 0) throw new Error('Unpatched @tanstack/react-start: ' + versions.reactStart);
          if (!versions.serverCore || cmp(versions.serverCore, '1.169.39') < 0) throw new Error('Unpatched @tanstack/start-server-core: ' + versions.serverCore);
          console.log(versions);
          NODE
      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
          else
            git commit -m "Update TanStack Start lockfile to patched versions"
            git push
          fi
